*{box-sizing:border-box}body{font-family:system-ui,"Noto Sans JP",sans-serif;margin:0;background:#f8f6ef;color:#283c31}header{background:#315b46;color:white;padding:22px max(16px,calc((100vw - 1100px)/2))}header a{color:white}main{max-width:1100px;margin:auto;padding:16px}.lead{background:white;padding:15px;border-radius:14px;line-height:1.7}.tools{display:flex;gap:9px;flex-wrap:wrap;align-items:center;position:sticky;top:0;background:#f8f6ef;padding:12px 0;z-index:2}input,select,button{font:inherit;padding:10px;border-radius:10px;border:1px solid #a3b9aa}button{background:#315b46;color:white;border:0;cursor:pointer}.tools input{min-width:150px;flex:1}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:13px}.card{background:white;border:1px solid #e0e7de;border-radius:15px;overflow:hidden;padding:12px}.card img{width:100%;height:190px;object-fit:contain;background:#f3f0e8;border-radius:10px;image-rendering:auto}.card h2{font-size:18px;margin:10px 0 4px}.group{font-size:12px;color:#53685a}.story{font-size:13px;min-height:35px}.card label{display:block;font-size:13px;margin:10px 0 4px}.card select{width:100%;background:#fff}.card textarea{width:100%;min-height:60px;font:inherit;border:1px solid #b8c7b7;border-radius:8px;padding:8px}.notice{color:#795221;font-size:13px}.meter{font-size:14px;font-weight:bold}footer{padding:40px 20px;text-align:center} @media(max-width:520px){.grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}.card{padding:8px}.card img{height:135px}.card h2{font-size:15px}.tools button{flex:1}.card textarea{min-height:80px}}
</style></head><body><header><a href="./index.html">← 診断トップ</a>　<a href="./zukan.html">図鑑を見る</a><h1>弁証50体｜イラスト対応点検</h1><p>正式な弁証名・物語・暫定画像の対応を一画面で確認できます。</p></header><main><div class="lead"><strong>確認上の注意</strong><p>画像50枚の存在と証名の割り当ては確認済みですが、動物の外観と物語の一致は未検証です。この画面は制作管理用であり、診断や医学的妥当性を示しません。画像の証名はすべてアプリのデータから表示しています。</p><p class="notice">確認結果はこの端末のブラウザ内にのみ保存されます。別の端末へ引き継ぐには「結果を書き出す」を利用してください。個人情報は入力しないでください。</p></div><div class="tools"><input id="q" placeholder="証名・分類・物語を検索" aria-label="検索"><select id="g" aria-label="分類"><option value="">全分類</option></select><select id="status" aria-label="確認状態"><option value="">全状態</option><option value="未確認">未確認</option><option value="要修正">要修正</option><option value="確認済">確認済</option></select><button id="export">結果を書き出す</button><span id="meter" class="meter" aria-live="polite"></span></div><div id="cards" class="grid"></div></main><footer>東洋ケアラボ｜制作点検用（画像は暫定デザイン）</footer><script>

 "group": "複合証", "pattern": "脾腎陽虚", "img": "48.webp", "story": "冬の台所の狸と亀"}, {"id": 49, "group": "複合証", "pattern": "肝腎陰虚", "img": "49.webp", "story": "月夜の狐と狼"}, {"id": 50, "group": "複合証", "pattern": "気滞血瘀", "img": "50.webp", "story": "緑と赤の渦にいる狐"}];
const key='toyo-bensho-v24-character-review';
let review={};try{review=JSON.parse(localStorage.getItem(key)||'{}')}catch(e){review={}}
const $=id=>document.getElementById(id),escapeHTML=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
for(const g of [...new Set(data.map(d=>d.group))]){const o=document.createElement('option');o.value=g;o.textContent=g;$('g').append(o)}
function save(){try{localStorage.setItem(key,JSON.stringify(review))}catch(e){alert('ブラウザに保存できません。結果を書き出して保存してください。')}meter()}
function meter(){let ok=0,fix=0;for(const d of data){let s=review[d.id]?.status||'未確認';if(s==='確認済')ok++;if(s==='要修正')fix++}$('meter').textContent=`確認済 ${ok}/50・要修正 ${fix}・未確認 ${50-ok-fix}`}
function render(){const q=$('q').value.trim().toLowerCase(),group=$('g').value,st=$('status').value;const root=$('cards');root.replaceChildren();for(const d of data){const state=review[d.id]?.status||'未確認';if(group&&d.group!==group||st&&state!==st||q&&!`${d.pattern} ${d.group} ${d.story}`.toLowerCase().includes(q))continue;const el=document.createElement('article');el.className='card';el.innerHTML=`<img loading="lazy" src="./${encodeURI(d.img)}" alt="${escapeHTML(d.pattern)}の暫定キャラクター画像"><div class="group">No.${d.id} · ${escapeHTML(d.group)}</div><h2>${escapeHTML(d.pattern)}</h2><div class="story">物語：${escapeHTML(d.story)}</div><label>画像と物語の対応</label><select aria-label="${escapeHTML(d.pattern)}の確認状態"><option>未確認</option><option>要修正</option><option>確認済</option></select><label>修正メモ（任意）</label><textarea placeholder="例：狐のはずが鳥になっている"></textarea>`;const sel=el.querySelector('select'),note=el.querySelector('textarea');sel.value=state;note.value=review[d.id]?.note||'';sel.addEventListener('change',()=>{review[d.id]={status:sel.value,note:note.value};save();if($('status').value)render()});note.addEventListener('change',()=>{review[d.id]={status:sel.value,note:note.value};save()});root.append(el)}meter()}
for(const id of ['q','g','status'])$(id).addEventListener(id==='q'?'input':'change',render);
$('export').onclick=()=>{const lines=[['番号','分類','証名','物語','確認状態','修正メモ'],...data.map(d=>[d.id,d.group,d.pattern,d.story,review[d.id]?.status||'未確認',review[d.id]?.note||''])];const tsv='\uFEFF'+lines.map(row=>row.map(v=>String(v).replace(/[\t\r\n]/g,' ')).join('\t')).join('\r\n');const url=URL.createObjectURL(new Blob([tsv],{type:'text/tab-separated-values;charset=utf-8'}));const a=document.createElement('a');a.href=url;a.download='東洋ケアラボ_50体イラスト確認結果.tsv';a.click();setTimeout(()=>URL.revokeObjectURL(url),1500)};render();
</script></body></html>
